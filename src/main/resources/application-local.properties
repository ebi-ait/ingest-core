# use this application properties profile for running locally
# with a local mongodb and rabbitmq
# i.e. -Dspring.profile.active=local
AUTH_ISSUER=https://login.elixir-czech.org/oidc/
GCP_JWK_PROVIDER_BASE_URL=https://www.googleapis.com/service_accounts/v1/jwk/
GCP_PROJECT_WHITELIST=hca-dcp-production.iam.gserviceaccount.com,human-cell-atlas-travis-test.iam.gserviceaccount.com,broad-dsde-mint-dev.iam.gserviceaccount.com,broad-dsde-mint-test.iam.gserviceaccount.com,broad-dsde-mint-staging.iam.gserviceaccount.com
SCHEMA_BASE_URI=https://dev.schema.morphic.bio/
SVC_AUTH_AUDIENCE=https://dev.data.humancellatlas.org/
USR_AUTH_AUDIENCE=https://dev.data.humancellatlas.org/
schema.base-uri=https://dev.schema.morphic.bio/

# Set this in your environment before running:
#export MONGO_URI="mongodb+srv://user:password@cluster.mongodb.net/MorphicDev?retryWrites=true&w=majority"
# Spring will automatically substitute ${MONGO_URI} with your env variable.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
#spring.data.mongodb.uri=mongodb://localhost:27017/ingest

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# display mongo queries
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
#logging.level.org.springframework.data.mongodb.repository.query=DEBUG
# display security messages
logging.level.org.springframework.security.access.expression.method=DEBUG
logging.level.org.springframework.security=DEBUG

# -------------------------
# Globus Transfer (no secrets in repo)
# -------------------------
morphic.globus.use-cli=true
morphic.globus.client-id=${MORPHIC_PROVIDER_CLIENT_ID:}
morphic.globus.client-secret=${MORPHIC_PROVIDER_CLIENT_SECRET:}

morphic.globus.collection-id=${MORPHIC_EBI_COLLECTION_UUID:}
morphic.globus.base-path=${MORPHIC_DEST_ROOT:}

morphic.globus.auth-url=https://auth.globus.org
morphic.globus.transfer-url=https://transfer.api.globus.org/v0.10
morphic.globus.transfer-scope=urn:globus:auth:scope:transfer.api.globus.org:all

morphic.globus.acl-collection-id=${MORPHIC_GLOBUS_ACL_COLLECTION_ID:}
morphic.globus.enable-acl=true

# -------------------------
# S3 staging + promote (local defaults, overridden in K8s)
# -------------------------
morphic.staging.bucket=${MORPHIC_STAGING_BUCKET:morphic-dev-staging-metadata}
morphic.staging.region=${MORPHIC_STAGING_REGION:eu-west-2}
morphic.staging.presign-expiry-seconds=${MORPHIC_STAGING_PRESIGN_EXPIRY_SECONDS:900}

morphic.staging.runner-instance-id=${MORPHIC_STAGING_RUNNER_INSTANCE_ID:}
morphic.staging.ssm-document-name=${MORPHIC_STAGING_SSM_DOCUMENT_NAME:AWS-RunShellScript}
morphic.staging.staging-base-dir=${MORPHIC_STAGING_BASE_DIR:/home/ec2-user/staging}

morphic.staging.globus-cli=${MORPHIC_GLOBUS_CLI:/home/ec2-user/.local/bin/globus}
morphic.staging.globus-run-as-user=${MORPHIC_GLOBUS_RUN_AS_USER:ec2-user}

morphic.staging.src-endpoint-id=${MORPHIC_STAGING_SRC_ENDPOINT_ID:}
morphic.staging.dest-endpoint-id=${MORPHIC_STAGING_DEST_ENDPOINT_ID:}